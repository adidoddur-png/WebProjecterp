<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect width="1200" height="180" fill="#ffffff" rx="12"/>

  <!-- Left: GMIT Logo -->
  <g transform="translate(15, 10) scale(0.53)">
    <!-- Outer Double Circle Border -->
    <circle cx="150" cy="150" r="144" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <circle cx="150" cy="150" r="136" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    
    <!-- Text Paths for Logo -->
    <path id="bTopArc" d="M 32,150 A 118,118 0 1,1 268,150" fill="none" />
    <path id="bBotArc" d="M 268,150 A 118,118 0 0,1 32,150" fill="none" />
    
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13.2" fill="#0f172a" letter-spacing="1.2">
      <textPath href="#bTopArc" startOffset="50%" text-anchor="middle">
        GM INSTITUTE OF TECHNOLOGY, DAVANGERE
      </textPath>
    </text>
    
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11.5" fill="#d97706" letter-spacing="2">
      <textPath href="#bBotArc" startOffset="50%" text-anchor="middle">
        ★ PROVIDES HI-TECH EDUCATION ★
      </textPath>
    </text>

    <!-- Inner Circle Border & Hexagon -->
    <circle cx="150" cy="150" r="96" fill="#f0fdf4" stroke="#0f172a" stroke-width="3"/>
    <polygon points="150,60 228,105 228,195 150,240 72,195 72,105" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

    <!-- Set-Square & Ruler -->
    <g transform="translate(142, 110)">
      <polygon points="0,75 55,75 55,20" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
      <polygon points="12,70 47,70 47,35" fill="#38bdf8" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <!-- Computer / Monitor -->
    <g transform="translate(90, 160) scale(0.6)">
      <rect x="0" y="0" width="46" height="34" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="3"/>
      <rect x="5" y="5" width="36" height="24" rx="2" fill="#0f172a"/>
    </g>

    <!-- Chemical Beaker -->
    <g transform="translate(178, 155) scale(0.55)">
      <path d="M 18,0 L 28,0 M 23,0 L 23,16 L 38,44 A 6,6 0 0,1 33,52 L 13,52 A 6,6 0 0,1 8,44 L 23,16" 
            fill="#e0f2fe" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 11,40 L 35,40 L 33,50 L 13,50 Z" fill="#38bdf8"/>
    </g>

    <!-- Book & Motto -->
    <g transform="translate(150, 206)">
      <path d="M 0,2 C -12,-6 -30,-6 -40,2 L -40,16 C -30,8 -12,8 0,16 C 12,8 30,8 40,16 L 40,2 C 30,-6 12,-6 0,2 Z" 
            fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    </g>
  </g>

  <!-- Center Text Information -->
  <g transform="translate(195, 0)">
    <!-- Trust Name -->
    <text x="0" y="44" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#1e293b" letter-spacing="0.2">
      Srishyla Educational Trust (R), Bheemasamudra
    </text>

    <!-- Main College Name -->
    <text x="0" y="98" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="0.5">
      GM INSTITUTE OF TECHNOLOGY, DAVANGERE
    </text>

    <!-- Subtitle / Affiliations -->
    <text x="0" y="140" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#334155">
      Approved by AICTE <tspan fill="#94a3b8" font-weight="400"> | </tspan> Affiliated to V.T.U. Belagavi <tspan fill="#94a3b8" font-weight="400"> | </tspan> Recognized by Govt. of Karnataka
    </text>
  </g>

  <!-- Right Side Accreditation Logos -->
  <!-- 1. NBA Logo Badge -->
  <g transform="translate(980, 22)">
    <!-- NBA Text Monogram -->
    <text x="0" y="55" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#06b6d4" letter-spacing="-1">
      NBA
    </text>
    <text x="0" y="78" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#0284c7" letter-spacing="0.8">
      NATIONAL BOARD
    </text>
    <text x="0" y="90" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#0369a1" letter-spacing="0.5">
      OF ACCREDITATION
    </text>
    <text x="0" y="106" font-family="'Inter', sans-serif" font-weight="700" font-size="9.5" fill="#0891b2">
      Accredited Programs: CSE/ECE/CE/ME/ISE/BT
    </text>
  </g>

  <!-- 2. NAAC Logo Badge -->
  <g transform="translate(1125, 80) scale(0.65)">
    <!-- Circular border -->
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#991b1b" stroke-width="6"/>
    <circle cx="0" cy="0" r="48" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    
    <!-- NAAC Text ring -->
    <path id="naacArc" d="M -40,0 A 40,40 0 1,1 40,0" fill="none" />
    <text font-family="'Inter', sans-serif" font-weight="800" font-size="7.5" fill="#991b1b">
      <textPath href="#naacArc" startOffset="50%" text-anchor="middle">
        ASSESSMENT &amp; ACCREDITATION
      </textPath>
    </text>
    
    <!-- India map / Diamond Shape -->
    <polygon points="0,-25 22,0 0,25 -22,0" fill="#dc2626"/>
    <text x="0" y="6" font-family="'Outfit', sans-serif" font-weight="900" font-size="19" fill="#fef08a" text-anchor="middle">
      Q
    </text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#991b1b" text-anchor="middle">
      NAAC A
    </text>
  </g>

  <!-- Bottom Decorative Border Line -->
  <line x1="20" y1="172" x2="1180" y2="172" stroke="#e2e8f0" stroke-width="2"/>
</svg>
